name: publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "npm dist-tag (next / latest)"
        required: true
        default: "next"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for trusted publishing (needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version
      - name: Publish (OIDC, no token)
        run: npm publish --tag "${{ inputs.tag }}" --access public
