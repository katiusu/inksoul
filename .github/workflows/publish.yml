name: publish

on:
  workflow_dispatch:
    inputs:
      task:
        description: "publish or dist-tag"
        required: true
        default: "publish"
      tag:
        description: "tag name (publish: new version tag; dist-tag: tag to move)"
        required: true
        default: "next"
      version:
        description: "version to point at (dist-tag task only)"
        required: false
        default: "0.7.0-rc.3"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        if: inputs.task == 'publish'
        uses: actions/checkout@v4
      - name: Setup node
        if: inputs.task == 'publish'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: npm publish
        if: inputs.task == 'publish'
        run: |
          npm install -g npm@latest
          npm publish --tag "${{ inputs.tag }}" --access public
      - name: Move dist-tag via OIDC
        if: inputs.task == 'dist-tag'
        run: |
          set -euo pipefail
          ID=$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | python3 -c "import json,sys;print(json.load(sys.stdin)['value'])")
          RES=$(curl -s -X POST -H "Authorization: Bearer ${ID}" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/dsh-inksoul" || true)
          echo "EXCHANGE_RESP: $(printf %s "$RES" | head -c 400)"
          TOKEN=$(printf %s "$RES" | python3 -c "import json,sys;print(json.load(sys.stdin).get('token',''))" || true)
          if [ -z "$TOKEN" ]; then echo NO_TOKEN_FROM_EXCHANGE; exit 1; fi
          CODE=$(curl -s -o /tmp/out -w "%{http_code}" -X PUT -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" --data-binary '"${{ inputs.version }}"' "https://registry.npmjs.org/-/package/dsh-inksoul/dist-tags/${{ inputs.tag }}")
          echo "PUT_HTTP=$CODE"
          cat /tmp/out; echo
          [ "$CODE" = "200" ] || [ "$CODE" = "201" ]
